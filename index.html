<div class="app">
 <aside class="side" id="side">
  <div class="kraftbg"></div>
  <div class="sidetop">
   <div class="brand"><b>Kenzi's Planner</b><i>cozy &amp; organized</i></div>
   <button class="tog" id="tog" title="Fold the menu" aria-label="Fold the menu">«</button>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidefoot"><svg><use href="#i-cup"/></svg><span>one thing at a time</span></div>
 </aside>
 <div class="shade" id="shade"></div>
 <main class="main" id="main">
  <div class="decor" aria-hidden="true"><svg class="l1"><use href="#i-leaf"/></svg><svg class="l2"><use href="#i-oak"/></svg><svg class="l3"><use href="#i-leaf"/></svg></div>
  <div class="top">
   <button class="menu" id="menu" aria-label="Open menu">☰</button>
   <div class="title"><h1 id="ptitle">Dashboard</h1><div class="sub" id="psub"></div></div>
   <div class="sync" id="sync" title="Saved"><i></i><span>saved</span></div>
   <svg class="topdoodle"><use href="#i-cup"/></svg>
   <button class="bell" id="bellbtn" aria-label="Reminders"><svg><use href="#i-bell"/></svg><span class="dot hide" id="belldot"></span></button>
  </div>
  <div id="view"></div>
 </main>
</div>

<div class="panel" id="npanel" aria-hidden="true">
 <div class="ph"><h2>⏰ Reminders</h2><button class="ib" id="nclose" aria-label="Close">✕</button></div>
 <div class="pb">
  <div class="card"><div class="wh mustard"><span class="t">Phone notifications</span></div><div class="bd">
   <div class="nstat" id="nstat">Checking…</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="nen">Turn on notifications</button><button class="btn soft" id="ntest">Send a test</button></div>
  </div></div>
  <div class="card"><div class="wh rust"><span class="t">New reminder</span></div><div class="bd">
   <label class="field"><span>What should I remind you about?</span><input id="rtext" placeholder="Pick up library books"></label>
   <label class="field"><span>When?</span><input id="rwhen" type="datetime-local"></label>
   <label class="field"><span>How often?</span><select id="rrep"><option value="">Just once</option><option value="daily">Every day</option><option value="weekly">Every week</option></select></label>
   <button class="btn" id="radd" style="width:100%">Add reminder</button>
  </div></div>
  <div class="card"><div class="wh olive"><span class="t">Coming up</span></div><div class="bd" id="rlist"><div class="nstat">Loading…</div></div></div>
 </div>
</div>
<div class="toast" id="toast"></div>
