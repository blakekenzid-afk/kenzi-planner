<style>
:root{--pink:#F9C9D7;--pinkD:#E8789B;--lav:#DCCFF5;--lavD:#8E6CCF;--mint:#C9EEDB;--mintD:#3FA975;--butter:#FFF1BF;--peach:#FFD9C2;--sky:#CFE6FA;--cream:#FFF9F6;--ink:#5B4A57;--soft:#9A8A95;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,sans-serif;font-size:16px;padding-bottom:88px;
 background-image:radial-gradient(circle at 10% 0%,#FDE4EC 0,transparent 40%),radial-gradient(circle at 100% 20%,#EEE6FB 0,transparent 35%);min-height:100vh}
h1,h2,h3{font-family:Comfortaa,cursive;margin:0}
header{padding:22px 20px 8px;max-width:1180px;margin:0 auto}
header h1{font-size:26px;color:var(--pinkD)}
header .sub{color:var(--soft);font-weight:600;margin-top:4px}
main{padding:8px 16px;max-width:1180px;margin:0 auto}
.card{background:#fff;border-radius:22px;padding:16px 18px;margin:12px 0;box-shadow:0 4px 14px rgba(232,120,155,.12)}
.card h2{font-size:17px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:14px 16px;min-height:84px;cursor:pointer}
.tile .lbl{font-size:13px;font-weight:700;opacity:.75}
.tile .big{font-family:Comfortaa;font-size:20px;font-weight:700;margin-top:8px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #F1E3EA}
.row .t{font-size:15px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--soft)}
.done .t{text-decoration:line-through;color:#B9AEB5}
.chk{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--pinkD);flex:none;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;font-size:15px;color:#fff}
.chk.on{background:var(--pinkD)}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.cd{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--butter);white-space:nowrap}
.cd.today{background:var(--pinkD);color:#fff}
input,select,textarea{font-family:Nunito;font-size:16px;border:2px solid #F1DDE6;border-radius:14px;padding:11px 12px;width:100%;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pinkD)}
.btn{background:var(--pinkD);color:#fff;border:0;border-radius:16px;padding:12px 18px;font-family:Comfortaa;font-weight:700;font-size:15px;cursor:pointer}
.btn.lav{background:var(--lavD)}
.types{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.types span{cursor:pointer;border:2px solid transparent}
.types span.sel{border-color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px}
.filters span{cursor:pointer;opacity:.55}.filters span.sel{opacity:1}
.x{border:0;background:none;color:#D3B8C4;font-size:20px;cursor:pointer}
.day{border-radius:18px;padding:12px 14px;margin:8px 0;background:#fff}
.day.today{background:var(--butter)}
.day .dh{font-family:Comfortaa;font-weight:700;margin-bottom:4px}
.day .it{font-size:14px;margin:3px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(232,120,155,.12);z-index:5}
nav button{border:0;background:none;font-family:Nunito;font-weight:700;font-size:11px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:14px;cursor:pointer}
nav button .e{font-size:22px}
nav button.on{color:var(--pinkD);background:#FDEAF0}
.fab{position:fixed;right:18px;bottom:96px;width:58px;height:58px;border-radius:50%;background:var(--pinkD);color:#fff;font-size:30px;border:0;box-shadow:0 6px 18px rgba(232,120,155,.45);cursor:pointer;z-index:6}
.sheet{position:fixed;inset:0;background:rgba(91,74,87,.3);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet .in{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:10;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--soft);text-align:center;padding:14px;font-weight:600}
.loading{text-align:center;padding:60px 0;font-family:Comfortaa;color:var(--pinkD)}
.sectionlink{float:right;font-size:13px;color:var(--pinkD);font-weight:800;cursor:pointer}
.amt{font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.cols>.card{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.top{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.top>.card{margin:0}
@media(min-width:900px){.top{grid-template-columns:minmax(320px,1fr) 1.4fr;align-items:stretch}.top .tiles{grid-template-columns:1fr 1fr}}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:22px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.days .day{margin:0;border:2px solid #F6E6EE}
.days .day.today{border-color:#F2D77A}
.row.hl{background:var(--butter);border-radius:14px;padding:8px 10px}
.dd{width:42px;text-align:center;font-family:Comfortaa;font-weight:700;font-size:13px;line-height:1.25}
.dd span{font-family:Nunito;font-weight:600;color:var(--soft);font-size:12px}
.row select{padding:7px 10px;border-radius:12px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{padding:9px 12px}
.addrow .btn{padding:9px 16px}
.morelink{text-align:center;color:var(--pinkD);font-weight:800;font-size:14px;padding:10px 0 2px;cursor:pointer}
.gotbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:2px dotted #F1E3EA;font-weight:800;color:var(--soft);cursor:pointer}
.gotbar .sectionlink{float:none}
#app.boardmode{max-width:none;padding:0 14px}
.btool{position:sticky;top:0;z-index:900;display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 10px}
.btool button{border:0;border-radius:999px;padding:8px 14px;font:700 14px Nunito;background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(91,74,87,.12);cursor:pointer}
.btray{background:#fff;border-radius:20px;padding:12px;margin:0 0 12px;box-shadow:0 4px 14px rgba(91,74,87,.12);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btray .opt{background:#FDEAF0;color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer}
.bgsw{width:56px;height:40px;border-radius:12px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer}
.bgsw.sel{border-color:var(--pinkD)}
.board{position:relative;border-radius:26px;min-height:500px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.wdg{position:absolute;border-radius:20px;box-shadow:0 8px 22px rgba(91,74,87,.16);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.wdg.drag{box-shadow:0 18px 36px rgba(91,74,87,.28);transform:rotate(-1.2deg) scale(1.02)}
.wh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font:700 13px Comfortaa;cursor:grab;touch-action:none;user-select:none;background:rgba(255,255,255,.55)}
.wbtn b{cursor:pointer;margin-left:8px;opacity:.5;font-size:13px}.wbtn b:hover{opacity:1}
.wb{flex:1;overflow:auto;padding:8px 14px 14px}
.wb .row{padding:5px 0}.wb .addrow input{padding:7px 10px}.wb .addrow .btn{padding:7px 12px}
.wr{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,rgba(91,74,87,.10) 55%)}
.board.locked .wh{cursor:default}.board.locked .wr,.board.locked .wbtn{display:none}
.big1{font:700 38px Comfortaa;line-height:1.1}.big2{font:700 22px Comfortaa;line-height:1.2}.big3{font:700 17px Comfortaa;margin:4px 0}
.wsub{color:var(--soft);font-weight:700;font-size:13px}
.wcd{font:700 46px Comfortaa;color:var(--pinkD);line-height:1.05}
.wnote{width:100%;height:100%;min-height:90px;border:0;background:transparent;resize:none;font:600 24px Caveat,cursive;color:var(--ink);outline:none}
.tbtns{margin-top:8px}.tbtns button{border:0;border-radius:12px;padding:6px 10px;font:800 13px Nunito;background:rgba(255,255,255,.85);color:var(--ink);cursor:pointer;margin:2px;box-shadow:0 2px 6px rgba(91,74,87,.1)}
@media(max-width:699px){.board{height:auto!important;min-height:0;padding:10px;overflow:visible}.wdg{position:relative;left:auto!important;top:auto!important;width:auto!important;height:auto!important;max-height:360px;margin:0 0 12px}.wr,.wh{cursor:default}.wr{display:none}}
</style><script>
/* ---- Home Screen app bridge: talks to the Sheet through Apps Script ---- */
var PLANNER_API='https://script.google.com/macros/s/AKfycby2K77ahxWPKILsKQNSUwa199QUB7uymfJbCbZUT9eRmwBT-8f6wZW-WVovfLPS7cZ4bQ/exec';
var PK=localStorage.getItem('pk')||'';
(function(){var m=(location.search+location.hash).match(/[?&#]k=([^&#]+)/);if(m){PK=decodeURIComponent(m[1]);localStorage.setItem('pk',PK);}})();
function plannerApi(fn,args){return fetch(PLANNER_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:PK,fn:fn,args:args||[]})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw j.e;return j.r;});}
(function(){function mk(ok,fail){var h={withSuccessHandler:function(f){return mk(f,fail);},withFailureHandler:function(f){return mk(ok,f);}};
 return new Proxy(h,{get:function(t,p){if(p in t)return t[p];return function(){var a=[].slice.call(arguments);plannerApi(p,a).then(function(r){ok&&ok(r);}).catch(function(e){if(String(e)==='locked')showLock();fail&&fail(e);});};}});}
 window.google={script:{run:mk()}};})();
function showLock(){if(document.getElementById('lock'))return;var d=document.createElement('div');d.id='lock';d.innerHTML='<div class="lockcard"><div style="font-size:44px">🌸</div><h2>Welcome to your planner</h2><p>Type your planner code to unlock.</p><input id="lockin" placeholder="planner code" autocapitalize="off" autocomplete="off"><button class="btn" onclick="var v=document.getElementById(\'lockin\').value.trim();if(v){localStorage.setItem(\'pk\',v);location.reload();}">Unlock</button></div>';document.body.appendChild(d);}
if(!PK)document.addEventListener('DOMContentLoaded',showLock);

<body>
<header><h1>Kenzi's Planner 🌸</h1><div class="sub" id="date"></div></header>
<main id="app"><div class="loading">🌸 loading your planner…</div></main>
<button class="fab" onclick="openAdd()">+</button>
<nav id="nav"></nav>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeAdd()"><div class="in">
 <h2 style="color:var(--pinkD);margin-bottom:12px">💭 What's on your mind?</h2>
 <input id="aT" placeholder="Get it out of your head…" autocomplete="off">
 <div class="types" id="aTypes"></div>
 <div class="grid2"><div><div class="s" style="font-size:13px;font-weight:700;color:var(--soft);margin-bottom:4px">When (optional)</div><input id="aW" type="date"></div>
 <div><div class="s" style="font-size:13px;font-weight:700;color:var(--soft);margin-bottom:4px">Notes</div><input id="aN" placeholder="optional"></div></div>
 <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" style="flex:1" onclick="saveThought()">Save it ✨</button><button class="btn lav" onclick="closeAdd()">Close</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
var TYPES={'To-do':['✅','#CFE6FA','#2F6FA8'],'Idea':['💡','#FFF1BF','#9A7A12'],'Grocery':['🛒','#C9EEDB','#2E8A5B'],'Gift':['🎁','#E7DAF8','#7650B8'],'Appointment':['📅','#FFE0CC','#B8612A'],'Bill':['💸','#FBD3E0','#C24C74'],'Kids':['🧸','#CDEFEE','#2B8C88'],'Someday':['☁️','#ECE8EF','#7D7385']};
var TABS=[['home','🏠','Home'],['board','🎨','Board'],['brain','🧠','Brain'],['week','📅','Week'],['meals','🍽️','Meals'],['bills','💸','Bills'],['kids','🎒','Kids']];
var D=null,tab='home',filt='All',selType='To-do';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function pd(s){if(!s||!/^\d{4}-\d\d-\d\d$/.test(s))return null;var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2]);}
function nice(s){var d=pd(s);return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):esc(s);}
function days(s){var d=pd(s),t=pd(D.today);return d?Math.round((d-t)/864e5):null;}
function cd(s){var n=days(s);if(n===null)return '';if(n===0)return '<span class="cd today">today!</span>';if(n===1)return '<span class="cd">tomorrow</span>';if(n<0)return '';return '<span class="cd">'+n+' days</span>';}
function pill(t){var c=TYPES[t];return c?'<span class="pill" style="background:'+c[1]+';color:'+c[2]+'">'+c[0]+' '+esc(t)+'</span>':'';}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1600);}
function fail(e){toast('Oops, that didn’t save 😕');console.log(e);load();}
function run(fn,args,ok){var r=google.script.run.withSuccessHandler(ok||function(){}).withFailureHandler(fail);r[fn].apply(r,args);}
function load(){google.script.run.withSuccessHandler(function(d){D=d;var t=pd(d.today);document.getElementById('date').textContent=t.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' ✨ one thing at a time';render();}).withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="card empty">Couldn’t load the planner. Pull down to refresh.</div>';}).getAll();}
function nav(){document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span class="e">'+t[1]+'</span>'+t[2]+'</button>';}).join('');}
function go(t){tab=t;render();window.scrollTo(0,0);}
function chk(on,fn){return '<div class="chk '+(on?'on':'')+'" onclick="'+fn+'">'+(on?'✓':'')+'</div>';}
function render(){nav();var h='';
 if(tab=='home')h=home();else if(tab=='board')h=board();else if(tab=='brain')h=brain();else if(tab=='week')h=week();else if(tab=='meals')h=meals();else if(tab=='bills')h=bills();else h=kids();
 var A=document.getElementById('app');A.className=tab=='board'?'boardmode':'';A.innerHTML=h;if(tab=='board')bFit();}
function tonight(){var x=D.dinners.filter(function(d){return d.date==D.today})[0];return x&&x.dinner?x.dinner:'Not planned yet';}
function billsSoon(){return D.bills.filter(function(b){var n=days(b.due);return n!==null&&n>=0&&n<=14&&!b.paid;});}
var WX=null,WXT=0;
var WXC={0:['☀️','Sunny'],1:['🌤️','Mostly sunny'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Foggy'],48:['🌫️','Foggy'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Drizzle'],56:['🧊','Freezing drizzle'],57:['🧊','Freezing drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🧊','Freezing rain'],67:['🧊','Freezing rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Snow showers'],95:['⛈️','Thunderstorms'],96:['⛈️','Storms + hail'],99:['⛈️','Storms + hail']};
function wc(c){return WXC[c]||['🌡️',''];}
function getWx(){if(Date.now()-WXT<15*60e3)return;WXT=Date.now();fetch('https://api.open-meteo.com/v1/forecast?latitude=40.4931&longitude=-85.6063&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FIndiana%2FIndianapolis&forecast_days=3').then(function(r){return r.json()}).then(function(j){WX=j;if((tab=='home'||tab=='board')&&!DR)render();}).catch(function(){WXT=0;});}
function wxCard(){getWx();if(!WX||!WX.current)return '<div class="card" style="background:linear-gradient(135deg,#CFE6FA,#E7DAF8)"><div class="s" style="font-weight:700">⛅ Gas City weather loading…</div></div>';
 var c=WX.current,d=WX.daily,n=wc(c.weather_code),r=Math.round;
 var days=[1,2].map(function(i){var dt=pd(d.time[i]);return '<div style="flex:1;background:rgba(255,255,255,.55);border-radius:16px;padding:8px 10px;text-align:center"><div class="s" style="font-weight:800;color:var(--ink)">'+dt.toLocaleDateString('en-US',{weekday:'short'})+'</div><div style="font-size:22px">'+wc(d.weather_code[i])[0]+'</div><div style="font-weight:800;font-size:13px">'+r(d.temperature_2m_max[i])+'° / '+r(d.temperature_2m_min[i])+'°</div>'+(d.precipitation_probability_max[i]>=20?'<div class="s">💧 '+d.precipitation_probability_max[i]+'%</div>':'')+'</div>';}).join('');
 return '<div class="card" style="background:linear-gradient(135deg,#CFE6FA,#E7DAF8)"><div style="display:flex;align-items:center;gap:14px"><div style="font-size:46px;line-height:1">'+n[0]+'</div><div style="flex:1"><div style="font-family:Comfortaa;font-weight:700;font-size:30px">'+r(c.temperature_2m)+'°</div><div style="font-weight:700">'+n[1]+' · feels '+r(c.apparent_temperature)+'°</div><div class="s" style="color:var(--ink);opacity:.7">H '+r(d.temperature_2m_max[0])+'° · L '+r(d.temperature_2m_min[0])+'° · 💧 '+d.precipitation_probability_max[0]+'% · 💨 '+r(c.wind_speed_10m)+' mph</div></div></div><div style="display:flex;gap:8px;margin-top:12px">'+days+'</div></div>';}
var OPEN={};
function tog(k){OPEN[k]=!OPEN[k];render();}
function more(k,arr,n,fn,label){var show=OPEN[k]?arr:arr.slice(0,n),h=show.map(fn).join('');if(arr.length>n)h+='<div class="morelink" onclick="tog(\''+k+'\')">'+(OPEN[k]?'Show less ▲':(label||'Show all')+' ('+(arr.length-n)+' more) ▼')+'</div>';return h;}
function kidRow(k){var past=days(k.date)<0;return '<div class="row" style="'+(past?'opacity:.45':'')+'"><div class="main"><div class="t">'+esc(k.what)+'</div><div class="s">'+nice(k.date)+' · '+esc(k.who)+(k.notes?' · '+esc(k.notes):'')+'</div></div>'+(past?'<span class="pill" style="background:#EEE">done ✓</span>':cd(k.date))+'</div>';}
function home(){var up=D.kids.filter(function(k){var n=days(k.date);return n!==null&&n>=0}).sort(function(a,b){return a.date<b.date?-1:1});
 var open=D.brain.filter(function(b){return !b.done}).length,todo=D.todos.filter(function(t){return !t.done});var bs=billsSoon();
 var h='<div class="top">'+wxCard()+'<div class="tiles"><div class="tile" style="background:var(--peach)" onclick="go(\'meals\')"><div class="lbl">🌙 Tonight’s dinner</div><div class="big">'+esc(tonight())+'</div></div>'+
 '<div class="tile" style="background:var(--pink)" onclick="go(\'bills\')"><div class="lbl">💸 Bills next 14 days</div><div class="big">'+bs.length+' coming up</div></div>'+

 else if(a=='reset'){t.end=0;t.left=300;}else{if(t.end)t.end+=a*1000;else t.left+=a;}render();}
